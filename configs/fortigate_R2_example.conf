# FortiGate R2 põhinäidis. Liideste nimed kontrolli enne käsu kasutamist seadme pealt.
config system global
    set hostname R2
end

config system admin
    edit admin
        set password kukejukuITS24
    next
end

# VLAN-liidesed sisemisel trunk-pordil.
config system interface
    edit "VLAN1-MGMT"
        set interface "port2"
        set vlanid 1
        set ip 172.18.1.1 255.255.255.240
        set allowaccess ping https ssh snmp
    next
    edit "VLAN10-KLIENDID"
        set interface "port2"
        set vlanid 10
        set ip 172.18.10.1 255.255.255.240
        set allowaccess ping
    next
    edit "VLAN30-SERVERID"
        set interface "port2"
        set vlanid 30
        set ip 172.18.30.1 255.255.255.240
        set allowaccess ping
    next
    edit "VLAN100-PROXMOX"
        set interface "port2"
        set vlanid 100
        set ip 172.18.100.1 255.255.255.240
        set allowaccess ping https ssh
    next
    edit "VLAN200-GUEST"
        set interface "port2"
        set vlanid 200
        set ip 172.18.200.1 255.255.255.240
        set allowaccess ping
    next
end

# DHCP relay kontori klientide võrgust DC1/DC2 serveritesse.
config system interface
    edit "VLAN10-KLIENDID"
        set dhcp-relay-service enable
        set dhcp-relay-ip 172.18.30.10 172.18.30.11
    next
end

# NAT internetti.
config firewall policy
    edit 10
        set name "VLAN10-to-WAN"
        set srcintf "VLAN10-KLIENDID"
        set dstintf "wan"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
